# Monthly, grouped dependency updates. Minor and patch releases arrive as one PR
# per dependency type rather than one per package, so keeping current costs a
# single review a month.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors that need a deliberate migration, not a bot PR. When this config
    # was first enabled, TypeScript 7 and ESLint 10 both failed CI. @types/node
    # must track the Node.js major the app runs on (22, see "engines"), or the
    # compiler will accept APIs that do not exist at runtime.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
